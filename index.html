<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kalbų mokymosi testas</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eaf3ff, #d6e8ff, #cfe2ff);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(12px);
  border-radius: 24px;
  padding: 30px;
  width: 92%;
  max-width: 520px;
  box-shadow: 0 25px 60px rgba(0,60,140,0.18);
  text-align: center;
}

/* PROGRESS */
.progress-container {
  width: 100%;
  height: 10px;
  background: #d6e8ff;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 18px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4a90e2, #6aa9ff);
  transition: width 0.3s ease;
}

.qnum {
  font-size: 13px;
  color: #6b86a8;
  margin-bottom: 10px;
}

h2 {
  font-size: 20px;
  color: #1f3b63;
  margin-bottom: 18px;
}

/* BUTTONS */
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  font-size: 15px;
  color: white;
  background: linear-gradient(135deg, #4a90e2, #6aa9ff);
}

/* RESULT */
.result-card {
  text-align: left;
  padding: 25px;
  border-radius: 20px;
  background: linear-gradient(135deg, #ffffff, #f3f8ff);
  box-shadow: 0 20px 50px rgba(0,60,140,0.12);
}

.result-title {
  font-size: 22px;
  font-weight: bold;
  color: #1f3b63;
  margin-bottom: 12px;
}

.result-text {
  font-size: 14px;
  color: #3b4f6b;
  line-height: 1.6;
  white-space: pre-line;
}
</style>
</head>

<body>

<div class="card">

  <div class="progress-container">
    <div class="progress-bar" id="progress"></div>
  </div>

  <div id="quiz">
    <div class="qnum" id="qnum"></div>
    <h2 id="question"></h2>
    <div id="answers"></div>
  </div>

  <div id="result" style="display:none;"></div>

</div>

<script>
let score = {
  structure: 0,
  communication: 0,
  immersion: 0,
  repetition: 0
};

let currentQuestion = 0;

/* (čia tavo 15 klausimų lieka kaip buvo) */
const questions = [ /* unchanged */ ];

function updateProgress() {
  let percent = (currentQuestion / questions.length) * 100;
  document.getElementById("progress").style.width = percent + "%";
}

function loadQuestion() {
  let q = questions[currentQuestion];

  document.getElementById("qnum").innerText =
    "Klausimas " + (currentQuestion + 1) + " iš " + questions.length;

  document.getElementById("question").innerText = q.q;

  let html = "";
  q.a.forEach(ans => {
    html += `<button onclick="answer('${ans.type}')">${ans.text}</button>`;
  });

  document.getElementById("answers").innerHTML = html;

  updateProgress();
}

function answer(type) {
  score[type]++;
  currentQuestion++;

  if (currentQuestion < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

/* 💙 YOUR NEW ENDINGS */
function showResult() {

  let maxType = Object.keys(score).reduce((a,b)=>
    score[a] > score[b] ? a : b
  );

  let title = "";
  let text = "";

  if (maxType === "structure") {
    title = "Struktūrinis mokymosi stilius";
    text =
`Tau geriausiai tinka mokytis tada, kai viskas yra aiškiai paaiškinta ir sudėliota žingsnis po žingsnio. Tu mėgsti suprasti taisykles, struktūrą ir logiką, o ne tiesiog „spėlioti“. Tau padeda planas, pratimai ir aiškūs pavyzdžiai, nes taip jauti progresą ir užtikrintumą.

Tinka: gramatikos mokymasis, užduotys, aiškus planas, užrašai ir struktūruotos pamokos.`;
  }

  if (maxType === "communication") {
    title = "Komunikacinis mokymosi stilius";
    text =
`Tu geriausiai mokaisi kalbėdamas ir bendraudamas su kitais. Tau svarbiausia yra praktika – net jei darai klaidų, tu vis tiek nori bandyti. Per pokalbius ir realias situacijas tu greitai tobulėji ir įgauni pasitikėjimo.

Tinka: pokalbiai su žmonėmis, kalbų mainai, dialogai, kalbėjimas net su klaidomis.`;
  }

  if (maxType === "immersion") {
    title = "Imersijos mokymosi stilius";
    text =
`Tu mokaisi natūraliai, per aplinką ir turinį. Tau patinka žiūrėti filmus, klausyti muzikos ar video ir iš to „pagauti“ kalbą. Tau nereikia visko iš karto suprasti – laikui bėgant viskas pradeda darytis aiškiau.

Tinka: filmai, YouTube, podcastai, subtitrai ir mokymasis per realų turinį.`;
  }

  if (maxType === "repetition") {
    title = "Kartojimo mokymosi stilius";
    text =
`Tu geriausiai įsimeni informaciją tada, kai ją kartoji daug kartų. Tau padeda nuoseklumas, trumpi, bet dažni mokymosi momentai ir praktika. Kuo daugiau kartoji, tuo labiau viskas įsitvirtina.

Tinka: flashcards, žodžių kartojimas, frazių mokymasis ir trumpi kasdieniai seansai.`;
  }

  document.getElementById("quiz").style.display = "none";
  document.getElementById("progress").style.width = "100%";

  document.getElementById("result").style.display = "block";
  document.getElementById("result").innerHTML = `
    <div class="result-card">
      <div class="result-title">${title}</div>
      <div class="result-text">${text}</div>
    </div>
  `;
}

loadQuestion();
</script>

</body>
</html>
