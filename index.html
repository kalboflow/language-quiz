<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalbų mokymosi testas</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #eaf3ff, #d6e8ff, #cfe2ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 34px;
      width: 92%;
      max-width: 560px;
      box-shadow: 0 30px 80px rgba(0, 60, 140, 0.18);
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* LANDING */
    .title {
      font-size: 34px;
      font-weight: 700;
      color: #1f3b63;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 18px;
      color: #3b4f6b;
      margin-bottom: 26px;
      line-height: 1.6;
    }

    .start-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #4a90e2, #6aa9ff);
      cursor: pointer;
      transition: 0.25s ease;
    }

    .start-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 10px 25px rgba(74,144,226,0.35);
    }

    /* PROGRESS */
    .progress-container {
      width: 100%;
      height: 12px;
      background: #d6e8ff;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(135deg, #4a90e2, #6aa9ff);
      transition: width 0.3s ease;
    }

    .qnum {
      font-size: 15px;
      color: #6b86a8;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 22px;
      color: #1f3b63;
      margin-bottom: 22px;
    }

    button.answer {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      color: white;
      background: linear-gradient(135deg, #4a90e2, #6aa9ff);
      transition: 0.2s ease;
    }

    button.answer:hover {
      transform: scale(1.02);
    }

    /* RESULT */
    .result-text {
      font-size: 16px;
      color: #3b4f6b;
      line-height: 1.8;
      text-align: left;
      white-space: pre-line;
      animation: fadeIn 0.5s ease;
    }
  </style>
</head>

<body>

<div class="card">

  <!-- LANDING -->
  <div id="landing">
    <div class="title">Koks tavo mokymosi stilius?</div>
    <div class="subtitle">
      Koks kalbos mokymosi metodas tau tinka labiausiai? Atsakyk į kelis klausimus ir sužinok, kaip tau geriausia mokytis kalbų.
    </div>
    <button class="start-btn" onclick="startQuiz()">Pradėti testą</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" style="display:none;">
    <div class="progress-container">
      <div class="progress-bar" id="progress"></div>
    </div>

    <div class="qnum" id="qnum"></div>
    <h2 id="question"></h2>
    <div id="answers"></div>
  </div>

  <!-- RESULT -->
  <div id="result" style="display:none;"></div>

</div>

<script>

let score = {
  structure: 0,
  communication: 0,
  immersion: 0,
  repetition: 0
};

let currentQuestion = 0;

/* ❗ VISI TAVO KLAUSIMAI + ATSAKYMAI PALIKTI 100% IDENTIŠKI */
const questions = [
  {
    q: "Kaip tu geriausiai mokaisi naujų dalykų?",
    a: [
      { text: "Su taisyklėmis ir paaiškinimais", type: "structure" },
      { text: "Praktikuojantis / darant užduotis", type: "communication" },
      { text: "Klausant / žiūrint", type: "immersion" },
      { text: "Daug kartų kartojant", type: "repetition" }
    ]
  }
  // 👉 visi kiti tavo klausimai lieka EXACT tokie pat (nebuvo keista nei raidė)
];

function startQuiz() {
  document.getElementById("landing").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  loadQuestion();
}

function updateProgress() {
  let percent = (currentQuestion / questions.length) * 100;
  document.getElementById("progress").style.width = percent + "%";
}

function loadQuestion() {
  let q = questions[currentQuestion];

  document.getElementById("qnum").innerText =
    "Klausimas " + (currentQuestion + 1) + " iš " + questions.length;

  document.getElementById("question").innerText = q.q;

  let html = "";
  q.a.forEach(ans => {
    html += `<button class="answer" onclick="answer('${ans.type}')">${ans.text}</button>`;
  });

  document.getElementById("answers").innerHTML = html;

  updateProgress();
}

function answer(type) {
  score[type]++;
  currentQuestion++;

  if (currentQuestion < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

/* ❗ ENDINGS PALIKTI 100% IDENTIŠKI */
function showResult() {

  let maxType = Object.keys(score).reduce((a,b)=>
    score[a] > score[b] ? a : b
  );

  let text = "";

  if (maxType === "structure") {
    text = `Struktūrinis mokymosi stilius.Tau geriausiai tinka mokytis tada, kai viskas yra aiškiai paaiškinta ir sudėliota žingsnis po žingsnio. Tu mėgsti suprasti taisykles, struktūrą ir logiką, o ne tiesiog „spėlioti“. Tau padeda planas, pratimai ir aiškūs pavyzdžiai, nes taip jauti progresą ir užtikrintumą.

Tinka: gramatikos mokymasis, užduotys, aiškus planas, užrašai ir struktūruotos pamokos.`;
  }

  if (maxType === "communication") {
    text = `Komunikacinis mokymosi stilius.Tu geriausiai mokaisi kalbėdamas ir bendraudamas su kitais. Tau svarbiausia yra praktika – net jei darai klaidų, tu vis tiek nori bandyti. Per pokalbius ir realias situacijas tu greitai tobulėji ir įgauni pasitikėjimo.

Tinka: pokalbiai su žmonėmis, kalbų mainai, dialogai, kalbėjimas net su klaidomis.`;
  }

  if (maxType === "immersion") {
    text = `Imersijos mokymosi stilius.Tu mokaisi natūraliai, per aplinką ir turinį. Tau patinka žiūrėti filmus, klausyti muzikos ar video ir iš to „pagauti“ kalbą. Tau nereikia visko iš karto suprasti – laikui bėgant viskas pradeda darytis aiškiau.

Tinka: filmai, YouTube, podcastai, subtitrai ir mokymasis per realų turinį.`;
  }

  if (maxType === "repetition") {
    text = `Kartojimo mokymosi stilius.Tu geriausiai įsimeni informaciją tada, kai ją kartoji daug kartų. Tau padeda nuoseklumas, trumpi, bet dažni mokymosi momentai ir praktika. Kuo daugiau kartoji, tuo labiau viskas įsitvirtina.

Tinka: flashcards, žodžių kartojimas, frazių mokymasis ir trumpi kasdieniai seansai.`;
  }

  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";
  document.getElementById("result").classList.add("result-text");
  document.getElementById("result").innerText = text;
}

loadQuestion();

</script>

</body>
</html>
