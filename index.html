<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalbų mokymosi testas</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f14, #1b1b2a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 520px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      color: white;
      background: linear-gradient(135deg, #6c5ce7, #4e54c8);
      transition: 0.2s ease;
    }

    button:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }

    .result {
      font-size: 22px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="card">

  <div id="quiz">
    <h2>Kaip tau lengviausia mokytis kalbų?</h2>

    <button onclick="answer('structure')">Per taisykles ir struktūrą</button>
    <button onclick="answer('communication')">Kalbant su žmonėmis</button>
    <button onclick="answer('immersion')">Per filmus / muziką</button>
    <button onclick="answer('repetition')">Per kartojimą</button>
  </div>

  <div id="result" class="result" style="display:none;"></div>

</div>

<script>
  let score = {
    structure: 0,
    communication: 0,
    immersion: 0,
    repetition: 0
  };

  function answer(type) {
    score[type]++;

    // DEMO: iškart rodome rezultatą (vėliau plėsim į 15 klausimų)
    showResult();
  }

  function showResult() {
    let maxType = Object.keys(score).reduce((a, b) =>
      score[a] > score[b] ? a : b
    );

    let text = "";

    if (maxType === "structure") text = "Tavo tipas: STRUKTŪRINIS 🧠";
    if (maxType === "communication") text = "Tavo tipas: KOMUNIKACINIS 🗣️";
    if (maxType === "immersion") text = "Tavo tipas: IMERSIJOS 🎬";
    if (maxType === "repetition") text = "Tavo tipas: KARTOJIMO 🔁";

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerText = text;
  }
</script>

</body>
</html>
