<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalbų mokymosi testas</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eaf3ff, #d6e8ff, #cfe2ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 30px;
      width: 90%;
      max-width: 520px;
      box-shadow: 0 20px 50px rgba(0, 60, 140, 0.15);
      text-align: center;
    }

    /* LANDING */
    .title {
      font-size: 26px;
      font-weight: bold;
      color: #1f3b63;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: #3b4f6b;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .start-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      color: white;
      background: linear-gradient(135deg, #4a90e2, #6aa9ff);
    }

    /* PROGRESS */
    .progress-container {
      width: 100%;
      height: 10px;
      background: #d6e8ff;
      border-radius: 20px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(135deg, #4a90e2, #6aa9ff);
      transition: width 0.3s ease;
    }

    .qnum {
      font-size: 14px;
      color: #6b86a8;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #1f3b63;
    }

    button.answer {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      color: white;
      background: linear-gradient(135deg, #4a90e2, #6aa9ff);
    }

    /* RESULT */
    .result-title {
      font-size: 22px;
      font-weight: bold;
      color: #1f3b63;
      margin-bottom: 12px;
    }

    .result-text {
      font-size: 14px;
      color: #3b4f6b;
      line-height: 1.6;
      text-align: left;
      white-space: pre-line;
    }
  </style>
</head>

<body>

<div class="card">

  <!-- LANDING -->
  <div id="landing">
    <div class="title">Koks tavo mokymosi stilius?</div>
    <div class="subtitle">
      Koks kalbos mokymosi metodas tau tinka labiausiai? Atsakyk į kelis klausimus ir sužinok, kaip tau geriausia mokytis kalbų.
    </div>
    <button class="start-btn" onclick="startQuiz()">Pradėti testą</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" style="display:none;">

    <div class="progress-container">
      <div class="progress-bar" id="progress"></div>
    </div>

    <div class="qnum" id="qnum"></div>
    <h2 id="question"></h2>

    <div id="answers"></div>
  </div>

  <!-- RESULT -->
  <div id="result" style="display:none;"></div>

</div>

<script>

let score = {
  structure: 0,
  communication: 0,
  immersion: 0,
  repetition: 0
};

let currentQuestion = 0;

const questions = [
  {
    q: "Kaip tu geriausiai mokaisi naujų dalykų?",
    a: [
      { text: "Su taisyklėmis ir paaiškinimais", type: "structure" },
      { text: "Praktikuojantis / darant užduotis", type: "communication" },
      { text: "Klausant / žiūrint", type: "immersion" },
      { text: "Daug kartų kartojant", type: "repetition" }
    ]
  },
  {
    q: "Koks tavo tikslas mokantis kalbų?",
    a: [
      { text: "Karjera / geresnis darbas ateityje", type: "structure" },
      { text: "Susikalbėti su žmonėmis kelionių metu", type: "communication" },
      { text: "Suprasti filmus, knygas, turinį", type: "immersion" },
      { text: "Tobulėti kaip žmogus", type: "repetition" }
    ]
  },
  {
    q: "Ar tau patogu kalbėti užsienio kalba, net jei darai klaidų?",
    a: [
      { text: "Taip, man svarbiausia susikalbėti", type: "communication" },
      { text: "Truputį, bet kartais bijau klaidų", type: "immersion" },
      { text: "Ne, noriu kalbėti tik taisyklingai", type: "repetition" },
      { text: "Geriau kol kas vengiu kalbėjimo", type: "structure" }
    ]
  },
  {
    q: "Kaip dažniausiai mokaisi laisvalaikiu?",
    a: [
      { text: "Spręsti užduotis", type: "structure" },
      { text: "Kalbėtis su žmonėmis", type: "communication" },
      { text: "Žiūrėti filmus", type: "immersion" },
      { text: "Programėlės / flashcards", type: "repetition" }
    ]
  },
  {
    q: "Jei kalbų mokymasis būtų žaidimas, kas tu būtum?",
    a: [
      { text: "Strategas", type: "structure" },
      { text: "Komandos žaidėjas", type: "communication" },
      { text: "Tyrinėtojas", type: "immersion" },
      { text: "Kartotojas", type: "repetition" }
    ]
  },
  {
    q: "Kaip mokytumeisi filmų?",
    a: [
      { text: "Analizuoju subtitrus", type: "structure" },
      { text: "Kartojimas su žmonėmis", type: "communication" },
      { text: "Žiūriu ir gaudau kontekstą", type: "immersion" },
      { text: "Kartoju frazes", type: "repetition" }
    ]
  },
  {
    q: "Kas tave motyvuoja?",
    a: [
      { text: "Procesas", type: "structure" },
      { text: "Žmonės", type: "communication" },
      { text: "Turinys", type: "immersion" },
      { text: "Žaidimas", type: "repetition" }
    ]
  },
  {
    q: "Kaip mokaisi po mokyklos?",
    a: [
      { text: "Planas + gramatika", type: "structure" },
      { text: "Kalbėjimas", type: "communication" },
      { text: "Filmai", type: "immersion" },
      { text: "Flashcards", type: "repetition" }
    ]
  },
  {
    q: "Žodžių mokymasis?",
    a: [
      { text: "Kartojimas", type: "structure" },
      { text: "Realaus gyvenimo situacijos", type: "communication" },
      { text: "Kontekstas", type: "immersion" },
      { text: "Programėlės", type: "repetition" }
    ]
  },
  {
    q: "Gyvūnas?",
    a: [
      { text: "Pelėda", type: "structure" },
      { text: "Vilkas", type: "communication" },
      { text: "Delfinas", type: "immersion" },
      { text: "Voverė", type: "repetition" }
    ]
  },
  {
    q: "Kai nesupranti?",
    a: [
      { text: "Analizuoju", type: "structure" },
      { text: "Kalbu su kitais", type: "communication" },
      { text: "Kontekstas", type: "immersion" },
      { text: "Kalu", type: "repetition" }
    ]
  },
  {
    q: "Rašymas?",
    a: [
      { text: "Taip", type: "structure" },
      { text: "Ne", type: "communication" },
      { text: "Nelabai", type: "immersion" },
      { text: "Kartais", type: "repetition" }
    ]
  },
  {
    q: "Kantrybė?",
    a: [
      { text: "Taip", type: "structure" },
      { text: "Vidutiniškai", type: "communication" },
      { text: "Ne", type: "immersion" },
      { text: "Taip", type: "repetition" }
    ]
  },
  {
    q: "Kaip jautiesi su nauja kalba?",
    a: [
      { text: "Tikslumas", type: "structure" },
      { text: "Greitis kalbėti", type: "communication" },
      { text: "Kontekstas", type: "immersion" },
      { text: "Pagrindai", type: "repetition" }
    ]
  },
  {
    q: "Mokymosi režimas?",
    a: [
      { text: "Analizė", type: "structure" },
      { text: "Kalbėjimas", type: "communication" },
      { text: "Tyrinėjimas", type: "immersion" },
      { text: "Kartojimas", type: "repetition" }
    ]
  }
];

function startQuiz() {
  document.getElementById("landing").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  loadQuestion();
}

function updateProgress() {
  let percent = (currentQuestion / questions.length) * 100;
  document.getElementById("progress").style.width = percent + "%";
}

function loadQuestion() {
  let q = questions[currentQuestion];

  document.getElementById("qnum").innerText =
    "Klausimas " + (currentQuestion + 1) + " iš " + questions.length;

  document.getElementById("question").innerText = q.q;

  let html = "";
  q.a.forEach(ans => {
    html += `<button class="answer" onclick="answer('${ans.type}')">${ans.text}</button>`;
  });

  document.getElementById("answers").innerHTML = html;

  updateProgress();
}

function answer(type) {
  score[type]++;
  currentQuestion++;

  if (currentQuestion < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

/* 💙 YOUR ENDINGS */
function showResult() {

  let maxType = Object.keys(score).reduce((a,b)=>
    score[a] > score[b] ? a : b
  );

  let text = "";

  if (maxType === "structure") {
    text = `Struktūrinis mokymosi stilius.

Tau geriausiai tinka mokytis tada, kai viskas yra aiškiai paaiškinta ir sudėliota žingsnis po žingsnio. Tu mėgsti suprasti taisykles, struktūrą ir logiką, o ne tiesiog „spėlioti“. Tau padeda planas, pratimai ir aiškūs pavyzdžiai, nes taip jauti progresą ir užtikrintumą.

Tinka: gramatikos mokymasis, užduotys, aiškus planas, užrašai ir struktūruotos pamokos.`;
  }

  if (maxType === "communication") {
    text = `Komunikacinis mokymosi stilius.

Tu geriausiai mokaisi kalbėdamas ir bendraudamas su kitais. Tau svarbiausia yra praktika – net jei darai klaidų, tu vis tiek nori bandyti. Per pokalbius ir realias situacijas tu greitai tobulėji.

Tinka: pokalbiai su žmonėmis, kalbų mainai, dialogai, kalbėjimas.`;
  }

  if (maxType === "immersion") {
    text = `Imersijos mokymosi stilius.

Tu mokaisi natūraliai, per aplinką ir turinį. Tau patinka filmai, muzika ir realios situacijos. Tu supranti kalbą per kontekstą.

Tinka: filmai, YouTube, podcastai, subtitrai.`;
  }

  if (maxType === "repetition") {
    text = `Kartojimo mokymosi stilius.

Tu geriausiai įsimeni informaciją per kartojimą. Tau padeda nuoseklumas ir trumpi, dažni mokymosi seansai.

Tinka: flashcards, žodžių kartojimas, kasdienė praktika.`;
  }

  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";
  document.getElementById("result").innerText = text;
}

loadQuestion();
</script>

</body>
</html>
