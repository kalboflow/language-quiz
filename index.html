<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalbų mokymosi testas</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eaf3ff, #d6e8ff, #cfe2ff);
      color: #1b1b1b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 30px;
      width: 90%;
      max-width: 520px;
      box-shadow: 0 20px 50px rgba(0, 60, 140, 0.15);
      text-align: center;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #1f3b63;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      color: white;
      background: linear-gradient(135deg, #4a90e2, #6aa9ff);
      transition: 0.2s ease;
    }

    button:hover {
      transform: scale(1.02);
      opacity: 0.95;
    }

    .result {
      font-size: 22px;
      margin-top: 20px;
      color: #1f3b63;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">

  <div id="quiz">

    <h2 id="question"></h2>

    <div id="answers"></div>

  </div>

  <div id="result" class="result" style="display:none;"></div>

</div>

<script>
  let score = {
    structure: 0,
    communication: 0,
    immersion: 0,
    repetition: 0
  };

  let currentQuestion = 0;

  const questions = [
    {
      q: "Kaip tu geriausiai mokaisi naujų dalykų?",
      a: [
        { text: "Su taisyklėmis ir paaiškinimais", type: "structure" },
        { text: "Praktikuojantis / darant užduotis", type: "communication" },
        { text: "Klausant / žiūrint", type: "immersion" },
        { text: "Daug kartų kartojant", type: "repetition" }
      ]
    },
    {
      q: "Koks tavo tikslas mokantis kalbų?",
      a: [
        { text: "Karjera / geresnis darbas ateityje", type: "structure" },
        { text: "Susikalbėti su žmonėmis kelionių metu", type: "communication" },
        { text: "Suprasti filmus, knygas, turinį", type: "immersion" },
        { text: "Tobulėti kaip žmogus", type: "repetition" }
      ]
    },
    {
      q: "Ar tau patogu kalbėti užsienio kalba, net jei darai klaidų?",
      a: [
        { text: "Taip, man svarbiausia susikalbėti", type: "communication" },
        { text: "Truputį, bet kartais bijau klaidų", type: "immersion" },
        { text: "Ne, noriu kalbėti tik taisyklingai", type: "repetition" },
        { text: "Geriau kol kas vengiu kalbėjimo", type: "structure" }
      ]
    },
    {
      q: "Kaip dažniausiai rinktumeisi mokytis laisvalaikiu?",
      a: [
        { text: "Spręsti užduotis / mokytis pagal taisykles", type: "structure" },
        { text: "Kalbėtis su kitais žmonėmis", type: "communication" },
        { text: "Žiūrėti filmus, klausyti tinklalaidžių", type: "immersion" },
        { text: "Naudoti programėles (pvz. Duolingo)", type: "repetition" }
      ]
    },
    {
      q: "Jei kalbų mokymasis būtų žaidimas, kas tu būtum?",
      a: [
        { text: "Strategas", type: "structure" },
        { text: "Komandos žaidėjas", type: "communication" },
        { text: "Tyrinėtojas", type: "immersion" },
        { text: "Kartotojas", type: "repetition" }
      ]
    }
  ];

  function loadQuestion() {
    let q = questions[currentQuestion];

    document.getElementById("question").innerText = q.q;

    let html = "";

    q.a.forEach(ans => {
      html += `<button onclick="answer('${ans.type}')">${ans.text}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
  }

  function answer(type) {
    score[type]++;
    currentQuestion++;

    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    let maxType = Object.keys(score).reduce((a, b) =>
      score[a] > score[b] ? a : b
    );

    let text = "";

    if (maxType === "structure") text = "Tavo tipas: STRUKTŪRINIS";
    if (maxType === "communication") text = "Tavo tipas: KOMUNIKACINIS";
    if (maxType === "immersion") text = "Tavo tipas: IMERSIJOS";
    if (maxType === "repetition") text = "Tavo tipas: KARTOJIMO";

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerText = text;
  }

  loadQuestion();
</script>

</body>
</html>
